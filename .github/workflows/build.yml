name: Build Windows 32-bit EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: x86
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check 32-bit interpreter
        run: python -c "import struct; assert struct.calcsize('P') == 4"
      - name: Test matching and click sequence
        run: python smoke_test.py
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ImageClickerWin7 app.py
      - name: Test EXE startup
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/ImageClickerWin7.exe" -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) { throw "EXE exited immediately with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ImageClickerWin7-x86
          path: dist/ImageClickerWin7.exe
          if-no-files-found: error
